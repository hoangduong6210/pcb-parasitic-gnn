name: reproducibility-contracts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lightweight-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.0.2 scipy==1.13.1 pytest==8.3.5
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile and check shell syntax
        run: |
          python -m compileall -q code tests
          for job in code/jobs/*.sh; do bash -n "$job"; done
      - name: Run no-solver contract tests
        id: contract-tests
        run: >-
          python -m pytest -q -p no:cacheprovider
          --junitxml=pytest-contract-report.xml tests
      - name: Publish contract failure annotations
        if: failure() && steps.contract-tests.outcome == 'failure'
        run: >-
          python code/quality/report_junit_failures.py
          pytest-contract-report.xml
      - name: Verify included immutable corpus manifests
        run: python code/quality/verify_corpora.py
      - name: Validate SLURM-only CLIs without computation
        run: |
          source code/env.sh
          python code/experiments/proofs/experiments_claim_proof.py --validate-only
          python code/experiments/proofs/experiments_reproduce_legacy_latency.py --validate-only
          python code/experiments/proofs/experiments_strict_egnn_ablation.py --validate-only
          python code/experiments/proofs/experiments_multisplit_accuracy.py --validate-only
          python code/experiments/proofs/experiments_fem_convergence.py --validate-only
          python code/data/audit_legacy_v2_geometry.py --validate-only
          python code/experiments/proofs/experiments_corpus_v3_field_labels.py --validate-only
          python code/experiments/proofs/finalize_corpus_v3.py --source-array-job-id VALIDATE --validate-only
          python code/experiments/proofs/experiments_corpus_v3_accuracy.py --validate-only
          python code/experiments/proofs/finalize_corpus_v3_accuracy.py --source-array-job-id VALIDATE --validate-only
          python code/experiments/proofs/experiments_corpus_v3_latency.py --validate-only
          python code/experiments/proofs/experiments_corpus_v3_strict_e3.py --validate-only
          python code/experiments/proofs/finalize_corpus_v3_strict_e3.py --source-array-job-id VALIDATE --validate-only
          python code/experiments/proofs/experiments_corpus_v3_trees.py --validate-only
          python code/experiments/proofs/finalize_corpus_v3_trees.py --source-array-job-id VALIDATE --validate-only
          python code/experiments/proofs/experiments_corpus_v3_lateral_labels.py --validate-only
          python code/experiments/proofs/finalize_corpus_v3_lateral.py --source-array-job-id VALIDATE --validate-only
          python code/experiments/proofs/experiments_corpus_v3_ranking.py --validate-only
          python code/experiments/proofs/finalize_corpus_v3_ranking.py --source-array-job-id VALIDATE --validate-only
